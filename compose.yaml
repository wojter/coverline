services:
  app:
    build: .
    environment:
      ENV: ${ENV:-prod}
      AUTH_MODE: ${AUTH_MODE:-cloudflare}
      CF_TEAM_DOMAIN: ${CF_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      ALLOWED_SERVICE_TOKENS: ${ALLOWED_SERVICE_TOKENS}
    restart: unless-stopped
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
